name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: 1

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test --ci --coverage
      - run: npx expo-doctor
        continue-on-error: true

  web:
    name: Web build + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:web
      - run: pnpm e2e:web
      - run: pnpm screenshot
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            screenshots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.run_id }}
          path: dist/
          retention-days: 7
