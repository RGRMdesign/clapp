name: Native

# Native builds are slow: run on main, on PRs labeled `native`, or manually.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, labeled]
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: 1

jobs:
  android-e2e:
    name: Android build + Maestro
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'native')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - run: pnpm install --frozen-lockfile
      # Local Supabase for the E2E flow (sign-up works without email confirmation locally).
      - run: pnpm exec supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api
      - name: Read local Supabase key
        run: echo "EXPO_PUBLIC_SUPABASE_KEY=$(pnpm exec supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
      - name: Prebuild + assemble release APK
        env:
          # 10.0.2.2 is the host machine as seen from the Android emulator.
          EXPO_PUBLIC_SUPABASE_URL: http://10.0.2.2:54321
          # Enables cleartext HTTP for this E2E build only (plugins/with-e2e-cleartext.js).
          E2E_LOCAL_BACKEND: '1'
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run Maestro on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test e2e/native --format junit --output maestro-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-${{ github.run_id }}
          path: |
            maestro-report.xml
            ~/.maestro/tests/
          retention-days: 14

  ios-build:
    name: iOS build (compile check)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'native')
    runs-on: macos-26 # Xcode 26 SDK → Liquid Glass
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prebuild + build for simulator
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_KEY: ci-compile-check
        run: |
          npx expo prebuild --platform ios
          xcodebuild -workspace ios/Clapp.xcworkspace -scheme Clapp -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50
